# GUIA DE LEITURA: docs/CI-CD.md descreve gatilhos, testes e limites.
# Os emojis sao apenas nomes de exibicao; IDs, permissoes e comandos permanecem iguais.
# ============================================================
# TERRAFORM CHECK - validacao da infraestrutura em PR (S-08)
# ============================================================
# Este arquivo veio da branch main e foi ADAPTADO no merge hibrido de
# 2026-09-09. A versao original validava `terraform/environments/dev`,
# estrutura que foi substituida pelas tres camadas com estado
# independente (D-017). Sem a adaptacao, o workflow apontaria para uma
# pasta inexistente e quebraria em todo PR.
#
# O QUE ELE FAZ
# Roda `fmt` e `validate` nas tres camadas a cada alteracao no Terraform.
# E barato - nao toca na AWS e nao custa nada - e pega o erro de sintaxe
# ANTES da sessao com o cluster no ar, quando o tempo e caro.
#
# Depois roda o `terraform test` do modulo iam-ci, que prova a regra de
# seguranca mais sensivel do projeto: so a branch main deste repositorio
# assume as roles da AWS via OIDC. O teste tambem roda sem AWS (ver o
# cabecalho de terraform/modules/iam-ci/tests/trust.tftest.hcl).
#
# POR QUE `-backend=false`
# O init normal tentaria conectar no bucket S3 do estado, o que exigiria
# credencial da AWS no CI. Aqui so queremos checar sintaxe e referencias
# entre modulos, entao o backend e dispensado.
#
# LIMITE CONHECIDO: a camada k8s NAO entra no validate com backend
# desligado de forma util - ela usa kubernetes_manifest, que consulta a
# API do cluster em tempo de plan. O validate de sintaxe funciona, mas
# um plan completo dela so e possivel com o cluster no ar.
# ============================================================

name: "🏗️ Terraform · validação e OIDC"

on:
  # Em Pull Request: barra o erro antes de entrar na main.
  pull_request:
    # So acorda se algo do Terraform mudar.
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-check.yml"

  # Em push na dev e main: valida a infraestrutura sem credenciais AWS.
  push:
    branches: [main, dev]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-check.yml"

  # Permite disparar a mao pela aba Actions.
  workflow_dispatch:

# Somente leitura do repositorio: este workflow nao publica nada.
permissions:
  contents: read

jobs:
  validate:
    name: fmt, validate e teste do OIDC
    runs-on: ubuntu-latest

    steps:
      # Baixa o codigo para o runner.
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Instala a versao fixada pelo projeto. O use_lockfile existe desde
      # Terraform 1.10; required_version >= 1.11 e a escolha desta base.
      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
          # false = nao embrulha a saida dos comandos, deixando o log
          # legivel quando algo falha.
          terraform_wrapper: false

      # Formatacao de TODO o diretorio, recursivamente.
      # -check faz o job falhar se algum arquivo estiver desalinhado, em
      # vez de corrigir em silencio.
      - name: terraform fmt
        run: terraform fmt -recursive -check terraform/

      # --------------------------------------------------------
      # Uma etapa por camada. Sao root modules independentes: cada um
      # precisa do proprio init antes do validate.
      # --------------------------------------------------------

      # Camada BASE: rede, ECR, SQS, DynamoDB e OIDC do CI.
      - name: validate - camada base
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      # Camada CLUSTER: EKS, node group, RDS, ElastiCache e IRSA.
      - name: validate - camada cluster
        run: |
          terraform -chdir=terraform/cluster init -backend=false -input=false
          terraform -chdir=terraform/cluster validate

      # Camada K8S: Secrets, StorageClass e ArgoCD.
      - name: validate - camada k8s
        run: |
          terraform -chdir=terraform/k8s init -backend=false -input=false
          terraform -chdir=terraform/k8s validate

      # --------------------------------------------------------
      # Teste do modulo iam-ci: 10 casos sobre a confianca OIDC e as
      # permissoes das roles do CI e do self-healing. Todos usam
      # `command = plan` com um provider sem acesso a AWS, entao o job
      # continua sem credencial nenhuma - nem a permissao id-token, que
      # pediria um token OIDC, existe neste workflow.
      #
      # O lock do modulo fixa o mesmo provider AWS da camada base, para o
      # teste avaliar as policies com a versao que fara o apply.
      # --------------------------------------------------------
      - name: test - confianca OIDC (modulo iam-ci)
        run: |
          terraform -chdir=terraform/modules/iam-ci init -backend=false -input=false
          terraform -chdir=terraform/modules/iam-ci test
