# ============================================================
# GRAFANA ALERTING - templates de notificacao
# ============================================================
# Lido pelo sidecar de alertas do Grafana (ConfigMap com o label
# grafana_alert: "1", gerado em gitops/observability/kustomization.yaml).
#
# ATENCAO AO CIFRAO: templates[].template e annotations das regras sao
# excecoes a interpolacao de variaveis de ambiente do provisionamento.
# Nesses campos, variaveis do template usam $ simples. Os settings dos
# contact points continuam interpolando as variaveis dos segredos.
# Fonte: documentacao Grafana, "Template variable interpolation":
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/#template-variable-interpolation
#
# Tres templates:
#   togglemaster.title       titulo comum (PagerDuty e Slack)
#   togglemaster.slack.text  corpo detalhado para o Slack
#   togglemaster.github      corpo JSON exigido pela API repository_dispatch
# ============================================================
apiVersion: 1

templates:
  - orgId: 1
    name: togglemaster
    template: |
      {{ define "togglemaster.title" -}}
      [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} - {{ .CommonLabels.service }}
      {{- end }}

      {{ define "togglemaster.slack.text" -}}
      {{ range .Alerts -}}
      *Servico:* {{ .Labels.service }} (severidade {{ .Labels.severity }})
      *O que aconteceu:* {{ .Annotations.summary }}
      *Detalhe:* {{ .Annotations.description }}
      *Valor medido:* {{ .ValueString }}
      *Inicio:* {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
      {{ if eq .Status "firing" }}*Acao automatica:* self-healing via GitHub Actions (rollout restart do Deployment)
      {{ end -}}
      *Regra:* {{ .GeneratorURL }}
      {{ if .DashboardURL }}*Dashboard:* {{ .DashboardURL }}
      {{ end -}}
      {{ if .PanelURL }}*Painel:* {{ .PanelURL }}
      {{ end -}}
      {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}
      {{ end -}}
      *Silenciar:* {{ .SilenceURL }}
      {{ end -}}
      {{- end }}

      {{ define "togglemaster.github" -}}
      {{ coll.Dict "event_type" "self-healing" "client_payload" (coll.Dict "service" .CommonLabels.service "alertname" .CommonLabels.alertname "status" .Status) | data.ToJSON }}
      {{- end }}
