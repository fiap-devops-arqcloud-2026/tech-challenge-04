# ============================================================
# APPLICATION - loki
# ============================================================
# Loki em modo SingleBinary, com disco gp3.
#
# Duas fontes (multi-source, Argo CD 2.6+): o chart oficial na versao
# fixada e o values versionado neste repositorio ($values).
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  # Apagar a Application apaga tambem os objetos do chart (ordem segura
  # no destroy: nada fica orfao no namespace).
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/gitops/observability/values/loki.yaml
    - repoURL: https://github.com/fiap-devops-arqcloud-2026/tech-challenge-04.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
