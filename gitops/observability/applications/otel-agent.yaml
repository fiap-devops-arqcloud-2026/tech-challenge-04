# ============================================================
# APPLICATION - otel-agent
# ============================================================
# DaemonSet que le os logs dos containers de cada no e entrega ao
# gateway. Onda 2: sobe depois do gateway.
#
# Duas fontes (multi-source, Argo CD 2.6+): o chart oficial na versao
# fixada e o values versionado neste repositorio ($values).
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  # Apagar a Application apaga tambem os objetos do chart (ordem segura
  # no destroy: nada fica orfao no namespace).
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.178.2
      helm:
        releaseName: otel-agent
        valueFiles:
          - $values/gitops/observability/values/otel-agent.yaml
    - repoURL: https://github.com/fiap-devops-arqcloud-2026/tech-challenge-04.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
